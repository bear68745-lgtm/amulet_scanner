name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Create fresh Flutter project
        run: |
          mkdir /tmp/flutter_app
          flutter create -t app /tmp/flutter_app

      - name: Copy project files
        run: |
          rm -rf /tmp/flutter_app/lib
          cp -r lib /tmp/flutter_app/lib
          cp pubspec.yaml /tmp/flutter_app/pubspec.yaml

      - name: Get dependencies
        working-directory: /tmp/flutter_app
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amulet-scanner-apk
          path: /tmp/flutter_app/build/app/outputs/flutter-apk/app-release.apk
