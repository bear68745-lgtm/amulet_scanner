name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "lib folder:"
          ls -la lib

      
      - name: Check main.dart
        run: |
          test -f lib/main.dart
          echo "พบ lib/main.dart แล้ว"

      - name: Create Android project files
        run: |
          flutter create --platforms=android --project-name amulet_scanner .
      
      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amulet-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
